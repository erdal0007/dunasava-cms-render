services:
  - type: web
    name: dunasava-cms
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:push && npm run db:seed
    startCommand: NODE_ENV=production node dist/boot.js
    healthCheckPath: /api/trpc/ping
    disk:
      name: dunasava-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: PUBLIC_ASSET_BASE_URL
        value: https://dunasava-cms.onrender.com
      - key: VITE_PUBLIC_ASSET_BASE_URL
        value: https://dunasava-cms.onrender.com
      - key: UPLOADS_DIR
        value: /var/data/uploads
